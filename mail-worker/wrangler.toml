
name = "cloud-malil"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "email"
database_id = "4432b111-421d-4434-92f8-209b2ed6e92b"

[[kv_namespaces]]
binding = "kv"
id = "70c3d2126c9142118a69605ea62bb126"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = ""

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/oss/*",
  "/static/*",
  "/attachments/*",
  "/proxy",
  "/realtime"
]

[triggers]
crons = ["0 * * * *"]

[[durable_objects.bindings]]
name = "ws"
class_name = "MailHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailHub"]

[vars]
#ai_model = ""
#analysis_cache = false
#orm_log = false
#domain = []
#admin = ""
#password = ""
#jwt_secret = ""

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
